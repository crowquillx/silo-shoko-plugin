name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r '.version' manifest.json)" = "$version"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/plugin-${GOOS}-${GOARCH}" .
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/plugin-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare checksums
        run: |
          mkdir release
          find artifacts -type f -name 'plugin-*' -exec cp {} release/ \;
          cd release
          sha256sum plugin-* > checksums.txt
      - name: Generate Silo repository index
        run: ./scripts/generate-repository-index.sh "$GITHUB_REF_NAME" release release/repository.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/plugin-linux-amd64
            release/plugin-linux-arm64
            release/plugin-darwin-arm64
            release/checksums.txt
            release/repository.json
